# 静的HTMLをそのまま GitHub Pages へ公開する。
#
# 【なぜ Actions 方式か】
# 従来の方式（legacy / Jekyll ビルド）が 2026-08-06 に失敗し続け、
# ポリシーを直しても公開ページが古いまま止まっていた。
# ここは「実装とポリシーが一致していること」が要る場所なので、
# 中身をそのまま配る Actions 方式に切り替えた。
name: Deploy static site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # 【なぜ延ばすか】既定の待ち時間は10分。GitHub 側の配信はもっとかかることがあり、
          # 実際 2026-08-06 は「打ち切り＝失敗」と出たあとに中身だけが公開される状態が続いた。
          # 配信そのものは動いているので、待ち時間を30分に延ばして最後まで見届ける。
          timeout: 1800000
          # 途中の問い合わせに何度か失敗しても、すぐ諦めない
          error_count: 20
